name: Prewarm Figma context
run-name: "Prewarm Figma (${{ inputs.ticket_key || 'manual' }})"

on:
  workflow_dispatch:
    inputs:
      figma_url:
        description: 'Figma design/file URL to cache for later intake runs'
        required: true
        type: string
      ticket_key:
        description: 'Epic key for an SM-triggered prewarm; blank for manual runs'
        required: false
        type: string
      intake_payload:
        description: 'URL-encoded ai-teammate workflow inputs; supplied automatically by SM'
        required: false
        type: string
      intake_ref:
        description: 'Git ref for the deferred intake dispatch'
        required: false
        default: main
        type: string

permissions:
  contents: read
  actions: write

jobs:
  prewarm:
    runs-on: ubuntu-latest
    concurrency:
      group: figma-api-context
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # The cache contains only Figma metadata and optional rendered PNGs;
      # neither the Figma token nor Jira data is written there.
      - name: Restore Figma context cache
        uses: actions/cache@v4
        with:
          path: .dmtools/cache/figma
          key: figma-context-v1-${{ runner.os }}-${{ hashFiles('.dmtools/agents/scripts/fetch-figma-context.js') }}-${{ github.run_id }}
          restore-keys: |
            figma-context-v1-${{ runner.os }}-${{ hashFiles('.dmtools/agents/scripts/fetch-figma-context.js') }}-

      - name: Fetch and cache Figma context
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_SOURCE_URL: ${{ inputs.figma_url }}
        run: |
          input_dir="${RUNNER_TEMP}/figma-prewarm"
          mkdir -p "${input_dir}"
          node .dmtools/agents/scripts/fetch-figma-context.js "${input_dir}"
          if [ -f "${input_dir}/figma_context_error.md" ]; then
            cat "${input_dir}/figma_context_error.md" >&2
            exit 1
          fi
          test -f "${input_dir}/figma_context.json"
          echo "Figma context cached successfully."

      # SM supplies the original intake inputs. This keeps prewarm and intake
      # strictly sequential: an intake starts only after the cache is usable.
      - name: Dispatch deferred intake
        if: ${{ inputs.intake_payload != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          INTAKE_PAYLOAD: ${{ inputs.intake_payload }}
          INTAKE_REF: ${{ inputs.intake_ref }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const payload = JSON.parse(decodeURIComponent(process.env.INTAKE_PAYLOAD));
          const args = ['workflow', 'run', 'ai-teammate.yml', '--repo', process.env.GITHUB_REPOSITORY,
            '--ref', process.env.INTAKE_REF || 'main'];
          for (const [key, value] of Object.entries(payload)) {
            if (value !== undefined && value !== null && value !== '') args.push('--raw-field', `${key}=${value}`);
          }
          execFileSync('gh', args, { stdio: 'inherit' });
          NODE
